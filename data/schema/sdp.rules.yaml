version: sdp-0.3.0
profile: https://salmon-data-mobilization.github.io/smn-data-pkg/profiles/salmon-data-package/v0.3/profile.json
rules:
- id: codes_required_for_categorical_columns
  severity: error
  description: metadata/codes.csv is required when any column_dictionary.csv row has
    column_role equal to categorical.
- id: code_value_required_without_vocabulary_iri
  severity: error
  description: metadata/codes.csv code_value is required unless vocabulary_iri is
    provided.
- id: measurement_columns_require_iadopt_fields
  severity: error
  description: Measurement columns require unit_iri, term_iri, property_iri, and entity_iri.
- id: table_file_paths_exist
  severity: error
  description: Each metadata/tables.csv file_name value must be a safe relative path
    to an existing data file.
- id: column_dictionary_matches_data_headers
  severity: error
  description: metadata/column_dictionary.csv rows must match the headers of the data
    files referenced by metadata/tables.csv.
- id: datapackage_consistent_with_csv_metadata
  severity: error
  description: Published datapackage.json descriptors must agree with the canonical
    CSV metadata and referenced data files.
- id: observation_structure_files_are_paired
  severity: error
  description: metadata/structure/observation_structures.csv and metadata/structure/observation_components.csv
    are optional, but either both files are present or neither file is present.
- id: one_measure_per_observation_structure
  severity: error
  description: Every observation structure has exactly one component with component_role
    equal to measure. When the paired extension is present, every measurement column
    is the measure of exactly one structure.
- id: observation_components_reference_columns
  severity: error
  description: Every observation component references a column in the same dataset and
    table. Measure components reference measurement columns; sosa:usedProcedure components
    are attributes that reference categorical columns.
- id: observation_component_order
  severity: error
  description: component_order is unique within each observation structure and forms a
    contiguous sequence starting at one. A column is bound at most once per structure.
- id: dimensions_define_measure_grain
  severity: error
  description: Measure and dimension components set required_when_observed to TRUE. When
    a measure is non-empty, every component marked required_when_observed is non-empty.
    Every structure has at least one dimension, and repeated rows with the same
    dictionary-type-normalized dimension tuple have identical normalized measure and
    bound attribute values.
# Rationale, the ruled reading, the refused owl:Class edge and the unresolved
# outcome's retirement condition: docs/adr/0002-sosa-procedure-reachability.md
- id: methods_are_sosa_procedures
  severity: error
  description: >-
    A method describes how an observation was made, not what was observed, and
    is recorded at the coarsest level where it is still true. Three placements,
    in order of preference - tables.csv protocol_iri/protocol_citation (a
    protocol names the per-measurement methods; in-package protocols cite the
    package README.md section), tables.csv method_iri (one method, no protocol
    document), or a data column bound with
    http://www.w3.org/ns/sosa/usedProcedure when the method varies per row.
    There is no per-package method registry, and column_dictionary carries no
    method field.

    Every method or protocol IRI is declared by a shared vocabulary and reaches
    a resource carrying rdf:type http://www.w3.org/ns/sosa/Procedure by a
    skos:broader path of zero or more steps. Zero or more is load-bearing: a
    directly typed IRI passes as the zero-length case, with no ancestor
    required and nothing further to check, and a path of one or more steps is
    how a SKOS narrower concept qualifies on an ancestor's typing - which is
    what a concept hierarchy asserts anyway. Reachability is a check, not an
    entailment: no reasoner will tell you that a narrower concept is a
    Procedure, and sosa:usedProcedure does not supply it either, because SOSA
    declares only schema:rangeIncludes sosa:Procedure, an annotation property
    with no inferential force.

    An asserted skos:broader, skos:broadMatch, or any other sub-property of
    skos:semanticRelation whose other side is an owl:Class is refused. It is
    refused by name rather than merely unsupported, and pointing it the other
    way does not help. Every sub-property of skos:semanticRelation has
    rdfs:domain skos:Concept and rdfs:range skos:Concept (SKOS S19-S22, with
    S41 making skos:broadMatch a sub-property of skos:broader), so such an edge
    entails that the OWL class is a skos:Concept and entails nothing at all
    about anything being a Procedure. It is OWL punning, it buys no entailment,
    and it is not a way to satisfy this rule. Reach a typed resource; do not
    assert an edge to a class.

    Estimate-type and data-quality vocabularies are never method vocabularies.
    A Hyatt (1997) estimate type (gcdfo:Type1 to gcdfo:Type6, under
    gcdfo:EstimateType) classifies how good an abundance estimate is, and an
    ordinal quality rating - the 1-5 scales behind fields such as
    INFORMATION_QUALITY and INDEX_QUALITY, or a reliability flag - says how
    much a datum can be relied on. Neither says how an observation was made, so
    neither satisfies this rule at any path length, and a column carrying
    either is an ordinary categorical attribute rather than one bound with
    sosa:usedProcedure.

    A check of this rule reports one of three outcomes for each IRI, each with
    its own message, and never passes silently. Absent - the vocabulary
    declaring the IRI's namespace was read and does not declare the IRI.
    Unreachable - the IRI is declared, and no resource on any skos:broader path
    from it carries rdf:type sosa:Procedure. Unresolved - the namespace could
    not be resolved, so neither of the other two outcomes could be decided.
    Unresolved is skipped and is not a pass: it leaves this rule unchecked for
    that IRI, it does not count as an executing check for this rule id, and a
    strict mode that requires IRIs (require_iris = TRUE) reports it as an error
    instead of skipping it.
- id: statistical_modifier_is_variable_identity
  severity: error
  description: column_dictionary.statistical_modifier_iri states what a reported
    value represents across the observations it summarizes (mean, maximum, total,
    peak). It is part of variable identity - daily mean and daily maximum are
    different variables - and resolves to an I-ADOPT StatisticalModifier concept
    (recommended vocabulary smn:StatisticalModifierScheme). A method is never
    recorded here.
# Same condition, refused edge and three outcomes as
# methods_are_sosa_procedures; rationale in
# docs/adr/0002-sosa-procedure-reachability.md
- id: row_varying_procedures_use_codes
  severity: error
  description: >-
    A component bound with http://www.w3.org/ns/sosa/usedProcedure is a
    categorical attribute. Every enumerated code for that column, including
    currently unobserved allowed values, has a codes.csv term_iri, and every one
    of those term_iri values meets the condition
    methods_are_sosa_procedures states for a method IRI: declared by a shared
    vocabulary, and reaching a resource carrying rdf:type
    http://www.w3.org/ns/sosa/Procedure by a skos:broader path of zero or more
    steps, so a directly typed IRI passes as the zero-length case. The same edge
    is refused here - an asserted skos:broader, skos:broadMatch or any other
    sub-property of skos:semanticRelation whose other side is an owl:Class - and
    a check reports the same three outcomes for each term_iri, absent,
    unreachable and unresolved, each with its own message, with unresolved
    skipped rather than passed.

    The exclusion bites hardest here, because codes.csv term_iri is where a
    classification is most easily mistaken for a method. An estimate-type or
    data-quality code - a Hyatt (1997) estimate type, an ordinal information- or
    index-quality rating, a reliability flag - says how good a value is, not how
    it was produced. A column of those is a categorical attribute that is not
    bound with sosa:usedProcedure, so its term_iri values are outside this
    rule's scope rather than terms that fail it.
