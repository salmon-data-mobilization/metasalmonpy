[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metasalmonpy"
version = "0.5.0"
description = "Python mirror of the metasalmon R package for Salmon Data Packages"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Data Stewardship Unit"}]
dependencies = ["pandas>=1.5", "requests>=2.31"]

[project.optional-dependencies]
context = ["openpyxl>=3.1", "pypdf>=4", "xlrd>=2.0"]
docs = ["quartodoc==0.11.1", "griffe<2"]
eml = ["lxml>=5,<7", "PyYAML>=6"]
# Live KNB/DataONE publication always rebuilds reviewed EML, so [knb] is
# [eml] plus the core requests dependency (already required).
knb = ["metasalmonpy[eml]"]
test = ["build>=1.2", "pytest>=7"]
verify = ["httpx>=0.28.1"]

[project.urls]
Documentation = "https://salmon-data-mobilization.github.io/metasalmonpy/"
Issues = "https://github.com/salmon-data-mobilization/metasalmonpy/issues"
Repository = "https://github.com/salmon-data-mobilization/metasalmonpy"

[tool.setuptools]
packages = ["metasalmonpy", "metasalmonpy.data", "metasalmonpy.scripts"]
package-dir = { "metasalmonpy" = ".", "metasalmonpy.data" = "data", "metasalmonpy.scripts" = "scripts" }

[tool.setuptools.package-data]
"metasalmonpy.data" = [
    "*.csv",
    "*.md",
    "schema/*.json",
    # The vendored SDP bundle, taken byte for byte from the smn-data-pkg tag
    # that sdp_schema.SDP_SPEC_TAG names, and the manifest recording that tag
    # and each file's SHA-256. Without the three bundle globs the wheel
    # installs but every schema read fails at runtime, so
    # `tests/test_sdp_schema.py` asserts all four entries.
    "schema/*.yaml",
    "schema/frictionless/metadata/*.json",
    "profiles/salmon-data-package/v0.3/*.json",
    "sdp-bundle-manifest.json",
    "xsd/eml-2.2.0/*",
    # The review-packet contract shared with metasalmon (hub B-327): the packet
    # schema and the review instructions every packet embeds, byte-identical
    # with metasalmon's inst/extdata/semantic-review/.
    "semantic-review/*.json",
    "semantic-review/*.txt",
]
