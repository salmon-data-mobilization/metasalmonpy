[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salmonpy"
version = "0.1.3"
description = "Python mirror of the metasalmon R package for Salmon Data Packages"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Data Stewardship Unit"}]
dependencies = ["pandas>=1.5", "requests>=2.31"]

[tool.setuptools]
packages = ["salmonpy", "salmonpy.data", "salmonpy.scripts"]
package-dir = { "salmonpy" = ".", "salmonpy.data" = "data", "salmonpy.scripts" = "scripts" }

[tool.setuptools.package-data]
"salmonpy.data" = ["*.csv", "*.md"]
